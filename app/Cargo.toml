[workspace]
resolver = "2"
members = [
    "core",
    "storage",
    "config",
    "provider",
    "pipeline",
    "listener",
    "admin",
    "pingogate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/whw23/PingoGate"

[workspace.dependencies]
# Internal crates — one per architecture layer (constitution IV/VIII).
pingo-core = { path = "core" }
pingo-storage = { path = "storage" }
pingo-config = { path = "config" }
pingo-provider = { path = "provider" }
pingo-pipeline = { path = "pipeline" }
pingo-listener = { path = "listener" }
pingo-admin = { path = "admin" }

# Pingora hot path + Admin ServeHttp (constitution III). rustls backend avoids
# the openssl/boringssl system toolchain (pure-Rust TLS, aligns with Safe Rust).
pingora = { version = "0.8", default-features = false, features = ["proxy", "rustls"] }

# External (locked stack per constitution III; non-locked additions justified in PRs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http = "1"
bytes = "1"
arc-swap = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Constitution XX: no unwrap/expect on external input. Warned workspace-wide,
# denied in CI via `cargo clippy -- -D warnings`.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
