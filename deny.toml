# cargo-deny configuration — license and duplicate-crate audit.
# Run: cargo deny --manifest-path app/Cargo.toml check

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
# serde_yaml is unmaintained but stable and on the locked stack (constitution III).
# Track for replacement; do not fail the build on its maintenance status.
ignore = ["RUSTSEC-2024-0320"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
