# core-rs/pingogate-core/Cargo.toml
# The package name is `pingogate-core` and produces the `pingogate-core` binary
# (default bin target from src/main.rs), matching the constitution's
# "pingogate-core (main binary)" requirement. The shared-types lib crate lives
# under `core/` as package `pingogate-core-types`.
[package]
name = "pingogate-core"
description = "PingoGate Rust kernel binary: bootstrap, signals, server assembly."
version.workspace = true
edition.workspace = true

[[bin]]
name = "pingogate-core"
path = "src/main.rs"

[dependencies]
pingogate-core-types = { path = "../core" }
pingogate-snapshot = { path = "../snapshot" }
pingogate-pipeline = { path = "../pipeline" }
pingogate-listener = { path = "../listener" }
pingogate-storage = { path = "../storage" }
pingora = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
