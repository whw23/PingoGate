# core-rs/pingogate-core/Cargo.toml
# The package name is `pingogate-core` and produces the `pingogate-core` binary
# (default bin target from src/main.rs), matching the constitution's
# "pingogate-core (main binary)" requirement. The shared-types lib crate lives
# under `core/` as package `pingogate-core-types`.
[package]
name = "pingogate-core"
description = "PingoGate Rust kernel binary: bootstrap, signals, server assembly."
version.workspace = true
edition.workspace = true

[[bin]]
name = "pingogate-core"
path = "src/main.rs"

[dependencies]
pingogate-core-types = { path = "../core" }
pingogate-snapshot = { path = "../snapshot" }
pingogate-pipeline = { path = "../pipeline" }
pingogate-listener = { path = "../listener" }
pingogate-storage = { path = "../storage" }
pingogate-keyvault = { path = "../keyvault" }
pingora = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
tokio-stream = "0.1"
async-trait = { workspace = true }
subtle = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
pingogate-transform = { path = "../transform" }
sha2 = { workspace = true }
