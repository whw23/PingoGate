# core-rs/Cargo.toml
[workspace]
resolver = "2"
members = [
    "core",
    "storage",
    "snapshot",
    "router",
    "transform",
    "provider",
    "pipeline",
    "listener",
    "pingogate-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Pingora hot path: rustls backend avoids openssl/boringssl system toolchain
# (pure-Rust TLS, aligns with Safe Rust constitution III). `proxy` feature
# re-exports `pingora::proxy::ProxyHttp`; default-features = false drops the
# zlib-ng cmake dependency.
pingora = { version = "0.8", default-features = false, features = ["proxy", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
prometheus = "0.13"
bytes = "1"
http = "1"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
async-trait = "0.1"
# Constant-time comparison for credential checks (constitution XX security).
subtle = "2"
# Lightweight percent-encoding for upstream URL query values.
percent-encoding = "2"
